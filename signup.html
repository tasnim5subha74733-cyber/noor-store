<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noor Store - Create Account</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:#0b0f14;
}

.box{
    width:90%;
    max-width:380px;
    padding:30px;
    background:#151a21;
    border:1px solid #333;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

h1{
    color:white;
    text-align:center;
    margin-bottom:5px;
}

.subtitle{
    color:#aaa;
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:1px solid #444;
    border-radius:10px;
    background:#0f1318;
    color:white;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#10a37f;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    background:#10a37f;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.login{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#10a37f;
    text-decoration:none;
}

.message{
    text-align:center;
    color:#ddd;
    margin-top:15px;
    min-height:20px;
}
</style>
</head>

<body>

<div class="box">

<h1>Noor Store</h1>

<p class="subtitle">Create your account</p>

<input
    type="email"
    id="email"
    placeholder="Email"
    autocomplete="email"
>

<input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="new-password"
>

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm Password"
    autocomplete="new-password"
>

<button id="signupBtn">
Create Account
</button>

<a class="login" href="login.html">
Already have an account? Login
</a>

<p class="message" id="message"></p>

</div>


<script type="module">

import { auth } from "./firebase.js";

import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const confirmInput =
document.getElementById("confirmPassword");

const signupBtn =
document.getElementById("signupBtn");

const message =
document.getElementById("message");


signupBtn.addEventListener("click", async function(){

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;


    if(!email || !password || !confirmPassword){

        message.textContent =
        "সব তথ্য পূরণ করুন";

        return;
    }


    if(password !== confirmPassword){

        message.textContent =
        "Password মিলছে না";

        return;
    }


    if(password.length < 6){

        message.textContent =
        "Password কমপক্ষে 6 অক্ষরের হতে হবে";

        return;
    }


    signupBtn.disabled = true;
    signupBtn.textContent = "Creating...";
    message.textContent = "";


    try{

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        message.textContent =
        "Account তৈরি হয়েছে!";


        setTimeout(function(){

            window.location.href =
            "login.html";

        },1000);


    }catch(error){

        console.error(error);


        if(error.code === "auth/email-already-in-use"){

            message.textContent =
            "এই Email দিয়ে আগে থেকেই Account আছে";

        }else if(error.code === "auth/invalid-email"){

            message.textContent =
            "সঠিক Email দিন";

        }else{

            message.textContent =
            "Signup failed: " + error.message;
        }


    }finally{

        signupBtn.disabled = false;
        signupBtn.textContent =
        "Create Account";

    }

});

</script>

</body>
</html>
