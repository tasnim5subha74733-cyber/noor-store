<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noor Store</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#222;
}

header{
background:linear-gradient(135deg,#111,#333);
color:white;
text-align:center;
padding:35px 15px;
}

header h1{
font-size:42px;
margin-bottom:8px;
}

header p{
color:#ddd;
font-size:17px;
}

nav{
background:white;
padding:15px;
display:flex;
justify-content:center;
gap:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.12);
position:sticky;
top:0;
z-index:50;
}

nav a{
text-decoration:none;
color:#111;
font-weight:bold;
}

.hero{
text-align:center;
padding:40px 15px 25px;
}

.hero h2{
font-size:30px;
margin-bottom:10px;
}

.hero p{
color:#666;
font-size:17px;
}

.products{
width:94%;
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
padding:20px 0 45px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
transition:transform 0.3s ease;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:260px;
object-fit:cover;
display:block;
}

.card-content{
padding:15px;
text-align:center;
}

.card-content h3{
font-size:21px;
margin-bottom:8px;
}

.price{
color:green;
font-size:22px;
font-weight:bold;
margin:10px 0;
}

.order-btn{
background:#25D366;
color:white;
border:0;
padding:12px;
width:100%;
border-radius:8px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.order-btn:hover{
background:#1daa50;
}

.box{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
width:90%;
max-width:420px;
padding:25px;
border-radius:15px;
box-shadow:0 5px 25px rgba(0,0,0,0.4);
z-index:999;
}

.box h2{
text-align:center;
margin-bottom:15px;
}

.box input,
.box textarea,
.box select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.box textarea{
min-height:90px;
resize:vertical;
}

.box button{
width:100%;
padding:12px;
margin-top:8px;
border:0;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.whatsapp-btn{
background:#25D366;
color:white;
}

.payment-btn{
background:#0b8f55;
color:white;
}

.close-btn{
background:#d9534f;
color:white;
}

footer{
background:#111;
color:white;
text-align:center;
padding:25px 15px;
margin-top:30px;
line-height:1.8;
}

.empty-message{
grid-column:1/-1;
text-align:center;
background:white;
padding:30px;
border-radius:12px;
color:#666;
}

@media(max-width:600px){

header h1{
font-size:34px;
}

nav{
gap:12px;
font-size:14px;
flex-wrap:wrap;
}

.hero h2{
font-size:25px;
}

.products{
width:92%;
grid-template-columns:1fr;
}

.card img{
height:300px;
}

}

</style>
</head>

<body>

<header>
<h1>Noor Store</h1>
<p>Welcome to Fatematun Noor Store</p>
</header>

<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="login.html">Login</a>
<a href="#contact">Contact</a>
</nav>

<section class="hero" id="home">
<h2>আমাদের নতুন কালেকশন</h2>
<p>সুন্দর ও আধুনিক পোশাক সাশ্রয়ী দামে</p>
</section>

<main class="products" id="products">

<!-- Product JavaScript দিয়ে এখানে দেখাবে -->

</main>
<!-- Order Form -->

<div class="box" id="orderBox">

<h2>অর্ডার করুন</h2>

<input id="customerName" placeholder="আপনার নাম">

<input id="customerMobile" placeholder="মোবাইল নাম্বার">

<textarea id="customerAddress" placeholder="আপনার ঠিকানা"></textarea>


<button class="whatsapp-btn" onclick="sendWhatsApp()">
WhatsApp Order
</button>


<button class="close-btn" onclick="closeOrder()">
Close
</button>

</div>



<!-- Payment Box -->

<div class="box" id="paymentBox">

<h2>Payment</h2>

<p style="text-align:center;font-size:18px;">
bKash: 01828181285
</p>

<p style="text-align:center;font-size:18px;">
Nagad: 01828181285
</p>


<input id="transaction" placeholder="Transaction ID">


<button class="payment-btn" onclick="confirmPayment()">
Confirm Payment
</button>


<button class="close-btn" onclick="closePayment()">
Close
</button>

</div>



<footer id="contact">

<p>অর্ডারের জন্য যোগাযোগ করুন</p>

<p>WhatsApp: 01828181285</p>

<p>Noor Store © 2026</p>

</footer>
<script>

let products = JSON.parse(localStorage.getItem("products")) || [];


function showProducts(){

let area = document.getElementById("products");

let html = "";


if(products.length === 0){

html = `
<div class="empty-message">
এখনো কোনো Product যোগ করা হয়নি
</div>
`;

}else{


products.forEach((p,index)=>{

html += `

<div class="card">

<img src="${p.image}">

<div class="card-content">

<h3>${p.name}</h3>

<p class="price">৳${p.price}</p>


<button class="order-btn" onclick="openOrder()">
Order Now
</button>


</div>

</div>

`;

});


}


area.innerHTML = html;


}


showProducts();




// Order Form

function openOrder(){

document.getElementById("orderBox").style.display="block";

}


function closeOrder(){

document.getElementById("orderBox").style.display="none";

}



function sendWhatsApp(){

let name =
document.getElementById("customerName").value;


let mobile =
document.getElementById("customerMobile").value;


let address =
document.getElementById("customerAddress").value;



if(!name || !mobile || !address){

alert("সব তথ্য পূরণ করুন");

return;

}



let text =
"New Order\n\n"+
"Name: "+name+
"\nMobile: "+mobile+
"\nAddress: "+address;



let number="8801828181285";


let link =
"https://wa.me/"+number+
"?text="+encodeURIComponent(text);



window.open(link,"_blank");


}




// Payment

function closePayment(){

document.getElementById("paymentBox").style.display="none";

}



function confirmPayment(){

let trx =
document.getElementById("transaction").value;


if(!trx){

alert("Transaction ID দিন");

return;

}


alert("Payment Submitted Successfully");


closePayment();

}


</script>


</body>
</html>
