<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noor Store Admin Panel</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
}

header{
    background:#111;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:600px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input,button{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    background:#008000;
    color:white;
    cursor:pointer;
}

.product{
    background:#eee;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
}

.delete{
    background:red;
}

img{
    max-width:100px;
}

</style>

</head>

<body>

<header>
<h2>🛒 Noor Store Admin</h2>
</header>


<div class="container">

<h3>নতুন Product যোগ করুন</h3>


<input id="name" placeholder="Product Name">

<input id="price" placeholder="Price">

<input id="image" placeholder="Image URL">


<button onclick="addProduct()">
Add Product
</button>


<h3>Product List</h3>


<div id="list"></div>


</div>


<script>


let products = JSON.parse(localStorage.getItem("products")) || [];



function addProduct(){


let name = document.getElementById("name").value;

let price = document.getElementById("price").value;

let image = document.getElementById("image").value;



if(name=="" || price==""){

alert("সব তথ্য দিন");

return;

}



products.push({

name:name,

price:price,

image:image

});



localStorage.setItem("products", JSON.stringify(products));



document.getElementById("name").value="";

document.getElementById("price").value="";

document.getElementById("image").value="";



showProducts();


}




function showProducts(){


let list = document.getElementById("list");


list.innerHTML="";



products.forEach((p,index)=>{


list.innerHTML += `

<div class="product">

<h4>${p.name}</h4>

<p>৳ ${p.price}</p>


${p.image ? `<img src="${p.image}">` : ""}


<button class="delete" onclick="deleteProduct(${index})">

Delete

</button>


</div>

`;

});


}




function deleteProduct(index){


products.splice(index,1);


localStorage.setItem("products", JSON.stringify(products));


showProducts();


}



showProducts();



</script>


</body>

</html>
