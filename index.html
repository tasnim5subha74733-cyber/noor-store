<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noor Store</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
}
header{
    background:#111;
    color:#fff;
    text-align:center;
    padding:20px;
}
.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px;
}
.card{
    background:#fff;
    width:250px;
    margin:10px;
    padding:15px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}
button{
    background:#25D366;
    color:white;
    border:none;
    padding:10px;
    width:100%;
    border-radius:5px;
}
</style>
</head>
<body>

<header>
<h1>Noor Store</h1>
<p>Online Clothing Shop</p>
</header>

<div class="products">

<div class="card">
<h2>Premium Panjabi</h2>
<p>৳1500</p>
<button>Order Now</button>
</div>

<div class="card">
<h2>Stylish Shirt</h2>
<p>৳1200</p>
<button>Order Now</button>
</div>

<div class="card">
<h2>Fashion T-Shirt</h2>
<p>৳800</p>
<button>Order Now</button>
</div>

</div>

</body>
</html>
