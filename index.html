<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noor Store</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#222;
}

header{
background:#111;
color:white;
padding:30px;
text-align:center;
}

header h1{
font-size:40px;
}

nav{
background:white;
padding:15px;
text-align:center;
}

nav a{
margin:10px;
text-decoration:none;
color:#111;
font-weight:bold;
}

.hero{
text-align:center;
padding:30px;
}

.products{
width:94%;
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px #ccc;
}

.card img{
width:100%;
height:280px;
object-fit:cover;
}

.card-content{
padding:15px;
text-align:center;
}

.price{
color:green;
font-size:22px;
font-weight:bold;
}

.order-btn{
width:100%;
padding:12px;
background:#25D366;
color:white;
border:0;
border-radius:8px;
margin-top:10px;
cursor:pointer;
}

.box{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:25px;
width:90%;
max-width:400px;
border-radius:15px;
box-shadow:0 5px 20px #555;
z-index:9999;
}

.box input,
.box textarea{
width:100%;
padding:12px;
margin:8px 0;
}

.box button{
width:100%;
padding:12px;
margin-top:8px;
}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}

</style>
</head>

<body>

<header>
<h1>Noor Store</h1>
<p>Welcome to our shop</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#products">Products</a>
<a href="login.html">Login</a>
</nav>

<section class="hero">
<h2>নতুন কালেকশন</h2>
<p>সুন্দর পোশাক সাশ্রয়ী দামে</p>
</section>

<main class="products" id="products">
</main>
<!-- Order Form -->

<div class="box" id="orderBox">

<h2>Order Form</h2>

<input id="name" placeholder="আপনার নাম">

<input id="mobile" placeholder="মোবাইল নাম্বার">

<textarea id="address" placeholder="আপনার ঠিকানা"></textarea>


<button onclick="sendWhatsApp()">
WhatsApp Order
</button>


<button onclick="closeOrder()">
Close
</button>

</div>



<!-- Payment Box -->

<div class="box" id="paymentBox">

<h2>Payment</h2>

<p>bKash: 01828181285</p>

<p>Nagad: 01828181285</p>


<input id="trx" placeholder="Transaction ID">


<button onclick="confirmPayment()">
Confirm Payment
</button>


<button onclick="closePayment()">
Close
</button>

</div>



<footer>

<p>অর্ডারের জন্য যোগাযোগ করুন</p>

<p>Noor Store © 2026</p>

</footer>
<script>

// Admin থেকে Product লোড

let products = JSON.parse(localStorage.getItem("products")) || [];

let productHTML = "";


products.forEach((p)=>{

productHTML += `

<div class="card">

<img src="${p.image}">

<div class="card-content">

<h3>${p.name}</h3>

<p class="price">৳${p.price}</p>

<button class="order-btn" onclick="openOrder()">
Order Now
</button>

</div>

</div>

`;

});


document.getElementById("products").innerHTML = productHTML;




// Order Form

function openOrder(){

document.getElementById("orderBox").style.display="block";

}


function closeOrder(){

document.getElementById("orderBox").style.display="none";

}



function sendWhatsApp(){

let name=document.getElementById("name").value;

let mobile=document.getElementById("mobile").value;

let address=document.getElementById("address").value;



if(name=="" || mobile=="" || address==""){

alert("সব তথ্য পূরণ করুন");

return;

}


let message =
"New Order\n\n"+
"Name: "+name+
"\nMobile: "+mobile+
"\nAddress: "+address;


let number="8801828181285";


window.open(
"https://wa.me/"+number+
"?text="+encodeURIComponent(message)
);


}




// Payment

function openPayment(){

document.getElementById("paymentBox").style.display="block";

}


function closePayment(){

document.getElementById("paymentBox").style.display="none";

}



function confirmPayment(){

let trx=document.getElementById("trx").value;


if(trx==""){

alert("Transaction ID দিন");

return;

}


alert("Payment received. Thank you!");

closePayment();

}



</script>


</body>
</html>
