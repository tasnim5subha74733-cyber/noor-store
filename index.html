<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noor Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#111;
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{
    font-size:40px;
}

header p{
    margin-top:10px;
    font-size:18px;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    width:280px;
    border-radius:15px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.card img{
    width:100%;
    border-radius:10px;
}

.card h2{
    margin:15px 0 10px;
}

.price{
    font-size:24px;
    color:#28a745;
    font-weight:bold;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#25D366;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1ea851;
}

@media (max-width:768px){

header h1{
    font-size:32px;
}

.products{
    padding:10px;
}

.card{
    width:100%;
}

}
</style>

</head>
<body>

<header>
<h1>Noor Store</h1>
<p>Online Clothing Shop</p>
</header>

<div class="products">

<div class="card">
<img src="images/panjabi.jpg" alt="Panjabi">
<h2>Premium Panjabi</h2>
<p class="price">৳1500</p>
<button>Order Now</button>
</div>

<div class="card">
<img src="images/shirt.jpg" alt="Shirt">
<h2>Stylish Shirt</h2>
<p class="price">৳1200</p>
<button>Order Now</button>
</div>

<div class="card">
<img src="images/tshirt.jpg" alt="T-Shirt">
<h2>Fashion T-Shirt</h2>
<p class="price">৳800</p>
<button>Order Now</button>
</div>

</div>

</body>
</html>
