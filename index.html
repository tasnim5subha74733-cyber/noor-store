<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noor Store</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#222;
}


/* Splash */

#splash{
position:fixed;
inset:0;
background:linear-gradient(135deg,#111,#333);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

.splash-logo{
color:white;
font-size:42px;
font-weight:bold;
}

.splash-text{
color:#ddd;
margin:15px;
}


.loader{
width:60px;
height:60px;
border:6px solid #555;
border-top-color:#25D366;
border-radius:50%;
animation:spin 1s linear infinite;
}


@keyframes spin{
to{
transform:rotate(360deg);
}
}



/* Header */

header{
background:#111;
color:white;
text-align:center;
padding:35px 15px;
}

header h1{
font-size:40px;
}

header p{
margin-top:10px;
}



/* Menu */

nav{
background:white;
display:flex;
justify-content:center;
gap:25px;
padding:15px;
box-shadow:0 2px 8px #ddd;
}


nav a{
text-decoration:none;
color:#222;
font-weight:bold;
}



/* Hero */

.hero{
text-align:center;
padding:35px 15px;
}

.hero h2{
font-size:30px;
}



/* Product */

.products{

width:94%;
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;

}



.card{

background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px #ccc;

}


.card img{

width:100%;
height:280px;
object-fit:cover;

}


.card-content{

padding:15px;
text-align:center;

}


.card h3{

font-size:22px;

}


.price{

color:#008000;
font-size:23px;
font-weight:bold;
margin:10px;

}


.order-btn{

width:100%;
padding:12px;
background:#25D366;
color:white;
border:none;
border-radius:8px;
font-size:17px;
font-weight:bold;
cursor:pointer;

}



footer{

margin-top:30px;
background:#111;
color:white;
text-align:center;
padding:20px;

}

</style>
</head>

<body>


<div id="splash">

<div class="splash-logo">
Noor Store
</div>

<div class="splash-text">
Loading...
</div>

<div class="loader"></div>

</div>



<header>

<h1>Fatematun Noor</h1>

<p>Welcome to Noor Store</p>

</header>



<nav>

<a href="#">Home</a>

<a href="#products">Products</a>

<a href="login.html">Login</a>

<a href="#contact">Contact</a>

</nav>



<section class="hero">

<h2>
আমাদের নতুন কালেকশন
</h2>

<p>
সুন্দর ও আধুনিক পোশাক সাশ্রয়ী দামে
</p>

</section>




<main class="products" id="products">

</main>





<!-- Payment Box -->

<div id="paymentBox" style="
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px #555;
width:90%;
max-width:400px;
z-index:9999;
text-align:center;
">


<h2>Payment</h2>


<p>bKash: 01828181285</p>
<p>Nagad: 01828181285</p>

<input id="trx" 
placeholder="Transaction ID"
style="
width:100%;
padding:12px;
margin:10px 0;
">


<button onclick="confirmPayment()" 
style="
width:100%;
padding:12px;
background:green;
color:white;
border:0;
border-radius:8px;
">

Confirm Order

</button>


<button onclick="closePayment()"
style="
width:100%;
padding:10px;
margin-top:10px;
">

Close

</button>


</div>





<footer id="contact">

<p>অর্ডারের জন্য যোগাযোগ করুন</p>

<p>Noor Store © 2026</p>

</footer>





<script>


// Admin থেকে Product Load


let products = JSON.parse(localStorage.getItem("products")) || [];


let html="";


products.forEach((p)=>{


html += `

<div class="card">


<img src="${p.image}">


<div class="card-content">


<h3>${p.name}</h3>


<p class="price">
৳${p.price}
</p>


<button class="order-btn" onclick="openPayment()">

Order Now

</button>


</div>


</div>

`;


});


document.getElementById("products").innerHTML=html;




// Payment


function openPayment(){

document.getElementById("paymentBox").style.display="block";

}



function closePayment(){

document.getElementById("paymentBox").style.display="none";

}



function confirmPayment(){


let trx=document.getElementById("trx").value;


if(trx==""){

alert("Transaction ID দিন");

return;

}


alert("আপনার অর্ডার গ্রহণ করা হয়েছে। ধন্যবাদ!");


closePayment();


}





// Splash Screen


window.addEventListener("load",()=>{


setTimeout(()=>{


document.getElementById("splash").style.display="none";


},2000);


});



</script>



</body>
</html>
